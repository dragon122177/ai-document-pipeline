[project]
name = "docuflux-document-pipeline"
version = "1.0.0"
description = "Provider-neutral document intelligence and human review pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
